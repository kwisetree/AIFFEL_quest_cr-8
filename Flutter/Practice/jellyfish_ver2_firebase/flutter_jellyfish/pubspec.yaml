name: jellyfish_classifier
description: A Flutter web app that classifies jellyfish images using VGG16.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=2.19.0 <3.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.3.0
  http_parser: ^4.1.2
  flutter_image_compress: ^1.1.0
  image_picker: ^1.1.2
  image_picker_for_web: ^3.0.6
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.5
  camera: ^0.11.1  # 카메라 기능
  path_provider: ^2.1.5  # 파일 저장 경로
  shared_preferences: ^2.5.2  # 로컬 저장
  firebase_core: ^3.12.1
  firebase_storage: ^12.4.4
  cloud_firestore: ^5.6.5
  cached_network_image: ^3.4.1
  js: ^0.7.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/jelly.svg