name: jellyfish_classifier
description: A Flutter web app that classifies jellyfish images using VGG16.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=2.19.0 <3.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^0.13.5
  image_picker: ^0.8.7
  image_picker_for_web: ^2.1.12
  cupertino_icons: ^1.0.2
  flutter_svg: ^2.0.5
  camera: ^0.10.3  # 카메라 기능
  path_provider: ^2.0.14  # 파일 저장 경로
  shared_preferences: ^2.1.0  # 로컬 저장

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/jelly.svg